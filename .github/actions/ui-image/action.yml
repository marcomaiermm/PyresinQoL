name: Forever simulator image
description: Reuse the pinned simulator image independently of addon changes
inputs:
  target:
    description: Docker target (headless or dev)
    required: true
outputs:
  image:
    description: Immutable Docker image ID
    value: ${{ steps.image.outputs.image }}
runs:
  using: composite
  steps:
    - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      id: cache
      continue-on-error: true
      env:
        SEGMENT_DOWNLOAD_TIMEOUT_MINS: 2
      with:
        path: ${{ runner.temp }}/forever-ui-image-${{ inputs.target }}
        key: forever-ui-v1-${{ runner.os }}-${{ runner.arch }}-${{ inputs.target }}-${{ hashFiles('tests/ui/Dockerfile', 'tests/ui/*.patch') }}
    - name: Load or build simulator image
      id: image
      shell: bash
      env:
        TARGET: ${{ inputs.target }}
        CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
      run: |
        case "$TARGET" in headless|dev) ;; *) exit 1 ;; esac
        cache_dir="$RUNNER_TEMP/forever-ui-image-$TARGET"
        if [[ "$CACHE_HIT" == true ]]; then
          docker image load --input "$cache_dir/image.tar" 2>&1 | tee "$RUNNER_TEMP/forever-ui-build.log"
        else
          mkdir -p "$cache_dir"
          rm -f "$cache_dir/image-id" "$cache_dir/image.tar"
          docker build --target "$TARGET" --iidfile "$cache_dir/image-id" -f tests/ui/Dockerfile tests/ui 2>&1 | tee "$RUNNER_TEMP/forever-ui-build.log"
          docker image save --output "$cache_dir/image.tar" "$(< "$cache_dir/image-id")"
        fi
        image=$(< "$cache_dir/image-id")
        [[ "$image" =~ ^sha256:[0-9a-f]{64}$ ]]
        docker image inspect "$image" >/dev/null
        echo "image=$image" >> "$GITHUB_OUTPUT"
    - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      if: steps.cache.outputs.cache-hit != 'true'
      continue-on-error: true
      with:
        path: ${{ runner.temp }}/forever-ui-image-${{ inputs.target }}
        key: forever-ui-v1-${{ runner.os }}-${{ runner.arch }}-${{ inputs.target }}-${{ hashFiles('tests/ui/Dockerfile', 'tests/ui/*.patch') }}
