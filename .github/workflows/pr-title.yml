name: PR title

# Squash merges make the PR title the commit on main, and Release Please reads it for the version and
# changelog: feat and fix titles are what players read on CurseForge.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions: {}

jobs:
  title:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          re='^(feat|fix|perf|refactor|docs|test|build|ci|chore|style|revert)(\([a-z0-9/_-]+\))?!?: .+'
          if [[ ! "$TITLE" =~ $re ]]; then
            echo "::error::PR title must be a Conventional Commit, e.g. 'feat(resourcebar): bars for health, power and combo points'. Got: $TITLE"
            exit 1
          fi
